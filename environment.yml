# Conda environment for the Python geometric morphometrics pipeline.
# Create: conda env create -f environment.yml
# Activate: conda activate gm-m2-morphometrics
# Start notebooks: jupyter lab
#
# The ImageJ/Fiji macro requires a separate ImageJ/Fiji installation.
# Pagel's lambda analysis uses R; install its packages in R as documented
# in HOW_TO_USE.md (ape, phytools, dplyr, stringr, readr, rotl).
name: gm-m2-morphometrics
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tensorflow
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - scikeras
